  .rc11 { stroke: var(--trib-3); stroke-width: 5.5; }
  .rb12 { stroke: var(--trib-2); stroke-width: 5.5; }
  .rc13 { stroke: var(--trib-3); stroke-width: 6.2; }
  .ra14 { stroke: var(--trib-1); stroke-width: 6.5; }
