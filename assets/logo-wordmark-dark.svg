<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3989 1000" width="3989" height="1000"
     role="img" aria-labelledby="wm-title wm-desc">
<title id="wm-title">basinkit</title>
<desc id="wm-desc">The basinkit wordmark. The b is drawn as a river basin: its stem is the trunk river, its bowl is the divide, four coloured tributaries feed it from inside, and the two i tittles are gauge points — a small one upstream and a large one downstream, the way a river grows.</desc>
<style>
  :root { --divide: #CFB27F; --trib-1: #2ECC9A; --trib-2: #5FA3EE; --trib-3: #A98BE8; --trib-4: #F4834B; --stem: #58AEDC; --ground: #10171A; --tint: #58AEDC; --word: #E8EEEC; }

  .ink { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; }
  #stem { stroke: var(--stem); stroke-width: 27; animation: draw 1.1s ease-out 0.0s forwards; }
  #bowl { stroke: var(--divide); stroke-width: 18; animation: draw 1.3s ease-out 0.55s forwards; }
  #t2 { stroke: var(--trib-2); stroke-width: 9; animation: draw 0.9s ease-out 1.45s forwards; }
  #t3 { stroke: var(--trib-3); stroke-width: 9; animation: draw 0.9s ease-out 1.6s forwards; }
  #t4 { stroke: var(--trib-4); stroke-width: 6.5; animation: draw 0.7s ease-out 1.7s forwards; }
  #t1 { stroke: var(--trib-1); stroke-width: 9; animation: draw 0.9s ease-out 1.75s forwards; }
  #counter { fill: var(--tint); opacity: 0;
             animation: soak 1.2s ease-out 1.6s forwards; }
  #outlet { fill: var(--stem); stroke: var(--ground); stroke-width: 5;
            transform-origin: 62px 172px; opacity: 0;
            animation: pop .5s cubic-bezier(.34,1.56,.64,1) 2.45s forwards,
                       beat 6s ease-in-out 2.95s infinite; }
  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes soak   { to { opacity: .10; } }
  @keyframes pop    { from { opacity: 0; transform: scale(.2); }
                      to   { opacity: 1; transform: scale(1); } }
  @keyframes beat   { 0%, 88%, 100% { transform: scale(1); }
                      94%           { transform: scale(1.18); } }
  @keyframes ripple { 0% { opacity: .45; transform: scale(.5); }
                      100% { opacity: 0; transform: scale(2.4); } }
  .ripple { fill: none; stroke: var(--stem); stroke-width: 4; opacity: 0;
            transform-origin: 62px 172px; }
  #r1 { animation: ripple 2.8s ease-out 2.85s infinite; }
  #r2 { animation: ripple 2.8s ease-out 3.85s infinite; }

  /* Anyone who asked for less motion gets the finished letter immediately. */
  @media (prefers-reduced-motion: reduce) {
    .draw { stroke-dashoffset: 0; }
    #counter { opacity: .10; }
    #outlet { opacity: 1; }
    .ripple { display: none; }
    .tittle { opacity: 1; animation: none; }
    #stem, #bowl, #t1, #t2, #t3, #t4, #counter, #outlet { animation: none; }
  }

  .glyph { fill: var(--word); }
  .tittle { fill: var(--word); transform-box: fill-box; transform-origin: 50% 50%;
             opacity: 0; }
  #tit-small { animation: pop .45s cubic-bezier(.34,1.56,.64,1) 2.15s forwards; }
  #tit-big   { animation: pop .55s cubic-bezier(.34,1.56,.64,1) 2.40s forwards; }
</style>
