site_name: basinkit
copyright: "Copyright &copy; 2026 Pradeepika Kaushik &middot; cite via doi.org/10.5281/zenodo.22181933"
site_description: Point to river basin to every open Earth observation layer
site_url: https://praddy-gbyte.github.io/basinkit/
repo_url: https://github.com/Praddy-GByte/basinkit
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo-32.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - assets/basinkit.css
  - assets/byline.css

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: numpy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - tables
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Why basinkit: why.md
  - Tutorial: tutorial.md
  - ArcGIS Pro: arcgis-pro.md
  - Delineation: delineation.md
  - Landscape form: landscape.md
  - Catchment response: catchment-response.md
  - Forcing a known channel: conditioning.md
  - Handing off to a model: model-coupling.md
  - Related work: related-work.md
  - Data catalogue: catalogue.md
  - Verification: verification.md
  - Data quality: data-quality.md
  - Notebooks:
      - Quickstart: notebooks/01_quickstart.ipynb
  - API reference: api.md
