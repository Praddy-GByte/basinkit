name: Release

on:
  release:
    types: [published]
  # A release fires 'published' exactly once, so a workflow that was disabled
  # at that moment misses it and cannot be replayed by editing the release.
  # This lets the same job be run by hand against the tag instead.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build and publish"
        required: true
        default: main

jobs:
  publish:
    # A pre-release fires 'published' too, so a test tag would otherwise be
    # built and pushed to PyPI as a real version. Run only for a full release,
    # or when dispatched by hand against a tag.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # trusted publishing, no API token to leak
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
