name: Docs

on:
  push: { branches: [main] }

# gh-deploy pushes a commit to the gh-pages branch. Two runs doing that at once
# race, and the loser is rejected as a non-fast-forward -- a red build caused by
# nothing but timing. One run at a time, and a newer push supersedes a queued
# one, because only the newest documentation is worth deploying.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[all,dev]"
      # gh-deploy commits to gh-pages. Without an identity the commit lands
      # with an empty author, which GitHub then attributes to nobody.
      # The address must be one GitHub knows belongs to this account, or the
      # deploy commit is credited to a different user than the repository's.
      - run: |
          git config user.name "Pradeepika Kaushik"
          git config user.email "156111942+Praddy-GByte@users.noreply.github.com"
      - run: mkdocs gh-deploy --force
