name: Docs

on:
  push: { branches: [main] }

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[all,dev]"
      - run: mkdocs gh-deploy --force
